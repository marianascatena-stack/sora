<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · SORA</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body class="auth-body auth-body--v2">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="icon-stripes" viewBox="0 0 120 100">
        <rect x="0" y="0" width="18" height="140" transform="skewX(-18)"/>
        <rect x="34" y="0" width="18" height="140" transform="skewX(-18)"/>
        <rect x="68" y="0" width="18" height="140" transform="skewX(-18)"/>
      </symbol>
      <symbol id="icon-rays" viewBox="0 0 200 100">
        <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <line x1="100" y1="90" x2="30" y2="10"/>
          <line x1="100" y1="90" x2="65" y2="4"/>
          <line x1="100" y1="90" x2="100" y2="0"/>
          <line x1="100" y1="90" x2="135" y2="4"/>
          <line x1="100" y1="90" x2="170" y2="10"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- Fundo -->
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-bg__scrim" aria-hidden="true"></div>

  <header class="auth-topbar">
    <a href="index.html" class="wordmark">SORA</a>
    <span class="auth-topbar__tag">Loja de tênis</span>
  </header>

  <main class="auth-stage">
    <div class="auth-card auth-card--v2">

      <div class="auth-badge">
        <svg class="auth-badge__rays" viewBox="0 0 200 100" aria-hidden="true"><use href="#icon-rays"/></svg>
        <span class="auth-badge__letter">S</span>
      </div>

      <h1 class="auth-card__title">Bem-vindo de volta</h1>
      <p class="auth-card__sub">Entre pra ver os lançamentos e continuar sua compra.</p>

      <div class="tabs tabs--v2" role="tablist" aria-label="Alternar entre entrar e criar conta">
        <button class="tab is-active" type="button" role="tab" aria-selected="true" data-tab="login">Entrar</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="signup">Criar conta</button>
        <span class="tabs__indicator" aria-hidden="true"></span>
      </div>

      <!-- LOGIN -->
      <form id="form-login" class="auth-form is-active" novalidate>
        <p class="form-alert" id="login-alert" role="alert" hidden></p>

        <label class="field">
          <span class="field__label">E-mail</span>
          <input type="email" name="email" id="login-email" placeholder="voce@email.com" autocomplete="email" required>
          <span class="field__error" id="login-email-error"></span>
        </label>

        <label class="field">
          <span class="field__label">Senha</span>
          <div class="field__control">
            <input type="password" name="senha" id="login-senha" placeholder="••••••••" autocomplete="current-password" required minlength="6">
            <button type="button" class="field__toggle" data-toggle-for="login-senha" aria-label="Mostrar senha">ver</button>
          </div>
          <span class="field__error" id="login-senha-error"></span>
        </label>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" id="login-remember" checked>
            <span>Lembrar de mim</span>
          </label>
          <button type="button" class="link-btn" id="btn-demo">Usar conta demo</button>
        </div>

        <button type="submit" class="btn-primary">
          <span>Entrar</span>
          <svg class="btn-primary__stripe" viewBox="0 0 120 100" aria-hidden="true"><use href="#icon-stripes"/></svg>
        </button>

        <p class="form-hint">Demo: <strong>demo@sora.com</strong> / <strong>sora123</strong></p>
      </form>

      <!-- CADASTRO -->
      <form id="form-signup" class="auth-form" novalidate>
        <p class="form-alert" id="signup-alert" role="alert" hidden></p>

        <label class="field">
          <span class="field__label">Nome</span>
          <input type="text" name="nome" id="signup-nome" placeholder="Seu nome" autocomplete="name" required minlength="2">
          <span class="field__error" id="signup-nome-error"></span>
        </label>

        <label class="field">
          <span class="field__label">E-mail</span>
          <input type="email" name="email" id="signup-email" placeholder="voce@email.com" autocomplete="email" required>
          <span class="field__error" id="signup-email-error"></span>
        </label>

        <label class="field">
          <span class="field__label">Senha</span>
          <div class="field__control">
            <input type="password" name="senha" id="signup-senha" placeholder="mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
            <button type="button" class="field__toggle" data-toggle-for="signup-senha" aria-label="Mostrar senha">ver</button>
          </div>
          <span class="field__error" id="signup-senha-error"></span>
        </label>

        <label class="field">
          <span class="field__label">Confirmar senha</span>
          <input type="password" name="confirmar" id="signup-confirmar" placeholder="repita a senha" autocomplete="new-password" required minlength="6">
          <span class="field__error" id="signup-confirmar-error"></span>
        </label>

        <button type="submit" class="btn-primary">
          <span>Criar conta</span>
          <svg class="btn-primary__stripe" viewBox="0 0 120 100" aria-hidden="true"><use href="#icon-stripes"/></svg>
        </button>
      </form>

    </div>

    <a href="home.html" class="auth-skip">Continuar sem entrar →</a>
  </main>

  <script src="script.js"></script>
</body>
</html>
